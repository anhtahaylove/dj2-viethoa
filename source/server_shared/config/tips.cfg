    # A list of custom tips added by the user or modpack. [default: ]
    S:customTips <
		Có 4 giai đoạn chính: 1) khám phá đầu game, 2) khối công nghệ lớn, 3) các mod phép thuật, 4) đồ OP cuối game.
		Dùng Ruler hoặc Tape Measure để đo khoảng cách giữa hai block!
		DivineRPG Donuts là nguồn thức ăn đầu game rất tốt khi bạn đã có trang trại Wheat!
		Applied Energistics được mở khóa theo từng giai đoạn.
		Giao dịch với Villager bị vô hiệu hóa, nhưng bạn có thể đào Emerald Ores trong mọi biome.
		Các biến thể Underground Biomes Stone có thể chuyển đổi qua lại bằng Chiseling.
		Các biến thể Underground Biomes Cobblestone, Sand và Gravel có thể chế tạo thành phiên bản vanilla.
		Chế tạo Plates bằng Metal Press chỉ tốn một nửa nguyên liệu so với Crafting.
		Đang tìm Parrots? Bạn có thể gặp chúng trong nhiều biome Plains, Forest hoặc Swamp!
		Tất cả Blood Magic Essences từ 1.7.10 đã trở lại!
		Đặt Immersive Engineering Excavator ở nhiều nơi để tìm được nhiều loại quặng khác nhau!
		Vanilla Hoes có độ bền cơ bản rất thấp. Hãy dùng Tinkers' Construct Mattock!
		Rất khác Divine Journey 1, với công thức và tiến trình riêng cùng nhiều nội dung hơn!
		Đây là modpack Expert nên hầu hết công thức đều khó hơn.
		Mục tiêu cuối cùng là tìm ra ý nghĩa cuộc sống... Đó có thể là gì?!
		AE2 Autocrafting chỉ mở khóa sau hầu hết các mod công nghệ khác, tại Quest Page thứ 13.
		Client cần ít nhất 6 GB RAM để chạy mượt. Luôn chừa ít nhất 1-2 GB RAM cho hệ điều hành.
		Mặc định, nhấn 'K' để mở Quest Book; bạn có thể đổi phím trong Controls!
		Chưa biết làm gì? Hãy xem những nhiệm vụ bạn vừa mở khóa!
		Tự động hóa mọi thứ!
		Tự động hóa mọi thứ ngay từ đầu sẽ giúp mỗi trang Quest mới diễn ra suôn sẻ hơn nhiều!
		Chưa biết cách tự động hóa thứ gì đó? Hãy vào Discord Divine Journey 2 để được trợ giúp!
		Neat là một mod của Vazkii.
		Bạn có nhận ra chi tiết tham chiếu nào trong Quest Book không? ;)
		Cuối game đỡ cày cuốc hơn rất nhiều so với Divine Journey 1!
		Bị mắc kẹt trong Erebus? Bạn có thể tìm nguyên liệu ngay trong dimension để tạo một Gateway Key khác.
		Một số Roots Spells giúp việc khám phá các dimension đầu game dễ dàng hơn nhiều!
		Cẩn thận, đừng để 'Atum' trở thành 'a tomb' của bạn! ;)
		Bewitchment chính là Witchery được phù phép lại.
		Các dimension của DivineRPG có nhiều dungeon tùy chỉnh do cộng đồng bổ sung!
		Có nhiều dungeon tùy chỉnh do cộng đồng thêm vào các dimension của Galacticraft!
		Tự động hóa Rainbow Generator là một thử thách, nhưng sẽ thưởng rất nhiều RF/tick.
		Extreme Reactors tạo ra NHIỀU năng lượng hơn HẲN mặc định.
		Water Mills đã bị giảm sức mạnh, còn các GP Generators khác được tăng sức mạnh.
		Từ Blood Magic trở đi, mọi thứ đắt hơn rất nhiều. Hãy tự động hóa tất cả!
		Cẩn thận với nấm độc trong Nether!
		Nếu rơi khỏi một dimension hư không, bạn sẽ vòng lại từ trên cùng.
		Nether có nhiều Glowstone hơn hẳn! Bạn sẽ cần đến nó.
		Căn cứ bị lag? Hãy mở rộng theo chiều ngang thay vì chiều dọc!
		Muốn biết đã chơi bao lâu? Mở kho đồ rồi nhấp biểu tượng 'Leaderboards' ở góc trên bên trái!
		Muốn claim một khu vực? Mở túi đồ và nhấp vào biểu tượng Map ở góc trên bên trái!
		Tham gia Discord Server của Divine Journey 2 qua liên kết trên Title Screen!
		Các multiblock của Immersive Engineering chỉ hình thành khi bạn đập đúng block và đúng mặt. (Đọc Quests để biết thêm!)
		Herobrine đã bị xóa trong bản cập nhật mới nhất.
		Các chuyên gia cho rằng tự động hóa mọi thứ là cách tốt nhất để phá đảo modpack này...!
		Chỉ nguyên liệu cơ bản mới có EMC. Những thứ khác vẫn cần được autocraft!
		Mọi hiệu ứng xấu từ AbyssalCraft Statues đều đã bị vô hiệu hóa. Tuyệt vời!
		Bạn có thể đưa Lava vào Smeltery qua một trong các Drains.
		Ringu là họa sĩ pixel tuyệt nhất!
		Dùng EvilCraft Promises để nâng cấp Blood Infuser!
		Blood Magic Potions có 8 ngụm thay vì chỉ 1!
		Nhớ mang Fire Resistance khi vào Erebus và Dreadlands!
		Wither Skeletons không còn rơi Drop of Evil nữa. Giờ có thể chế tạo nó! (Craft of Evil?!)
		Lesser Shoggoths và Shoggoth Lairs đã bị vô hiệu hóa. Mọi thứ từ chúng giờ đều có thể chế tạo!
		Cursed Earth là cách tốt nhất để farm mob ở đầu game!
		Nghe nói bạn thích công thức phức tạp, nên tôi đã nhét một công thức vào trong một công thức để bạn chế công thức bằng công thức!
		Cẩn thận Pumpkins và Cacti! Tại sao ư? Hoooooàn toàn không có lý do gì đâu...!
		Muốn thêm mod bạn thích? Nếu chơi Singleplayer thì cứ tự nhiên! Nếu đó là mod client-only, bạn cũng có thể dùng trên server!
		Có thứ phiền phức nào bạn phải chế tạo liên tục không? Tự động hóa nó đi!
		Tinkers' Tools rất tuyệt ở đầu game, nhưng không dành để dùng suốt modpack! Hãy dùng Tools từ DivineRPG, AbyssalCraft, EnderIO và sau đó là Draconic Evolution!
		Akashic Tome giúp lưu sách từ nhiều mod chỉ trong 1 item.
		Omniwand giúp lưu cờ lê từ nhiều mod chỉ trong 1 item.
		Well of Suffering Ritual là cách tốt nhất để tự động kiếm LP trong Blood Magic.
		Để tự động tạo Will trong Blood Magic, hãy kết hợp 3 Ritual: Gathering of the Forsaken Souls, Crack of the Fractured Crystal & Ritual of Zephyr.
		Nếu công thức cần Blood Magic Orb cấp thấp, bạn vẫn có thể dùng Orb cấp cao hơn.
		Mệt rồi à? Hãy nghỉ ngơi và quay lại vào ngày mai!
		Không tạo đủ nhạc cho Totemic? Hãy dùng nhiều loại nhạc cụ, nhiều Drums và nhiều Wind Chimes! Nếu có bạn chơi cùng, cả hai có thể cùng tạo nhạc!
		Modpack đã có Chisels & Bits, nhưng nếu chơi Singleplayer, bạn có thể thêm các mod hỗ trợ xây dựng!
		Bạn không nhất thiết phải dùng Flint & Steel để đốt Roots Pyre. Hãy đặt một khối Netherrack rồi châm lửa gần Roots Pyre! Bạn cũng có thể đặt kho đồ bên dưới để tự động cấp item!
		Bạn có thể tự động hóa Fey Crafter như một Runic Crafter trong Chapter 18!
		Bạn sẽ cần chế tạo 6 bậc Leather trong suốt modpack.
		Bạn sẽ cần chế tạo 20 bậc Machine Frames trong suốt modpack. Hãy tự động hóa để không phải làm lại từng bước mỗi lần!
		Modpack có Ore Excavator, hãy dùng ngay từ đầu để đào mỏ dễ hơn nhiều!
		Dùng quá nhiều Mekanism Universal Cables có thể khiến căn cứ hơi lag. Hãy thử tìm giải pháp thay thế!
		Dùng quá nhiều Crafting Cards có thể khiến ME System rất lag. Thay vào đó, hãy thiết lập Level Emitters hoặc chỉ chế tạo khi cần!
		Có 5 bậc AE2 Processors mới. Bậc càng cao sẽ mở khóa Storage Cells càng lớn.
		Ăn Enchanted Golden Date từ Atum sẽ cho bạn các hiệu ứng giống Enchanted Golden Apple.
		Đặt thức ăn lên Plate sẽ khiến nó ngon hơn hẳn (...chẳng hiểu vì sao)!
		Khó thu thập Dragon's Breath vì chỉ nhận được Ender Air Bottles? Hãy thử lấy mà không nhấp vào End Stone nào! (Bạn cần căn góc nhấp chính xác.)
		Luôn để dành một ít GP Powder để nhân bản, phòng khi vô tình dùng hết!
		Bạn có thể chế tạo phiên bản Enhanced của nhiều EnderIO Machines.
		Phantomfaces là những người bạn hữu ích!
		Bạn có thể tạo Seared Bricks bằng cách nung Stone hoặc Cobblestone trong Smeltery.
		Lần đầu vào Nether có thể mất khá lâu. Hãy kiên nhẫn!
		Boss hầm ngục Gold của Aether khá khó tìm. Bạn cũng không thể gây sát thương theo cách thông thường mà phải đánh bật Ice Balls về phía nó!
		AgriCraft cho phép nhân bản mọi loại cây trồng bằng đột biến. Vì cơ chế này khá OP, đặc biệt với cây trồng Mystical Agriculture, Crop Sticks chỉ được mở khóa rất muộn trong modpack!
		Snowballs và Ender Pearls có thể xếp chồng đến 64.
		Nếu khó sắp xếp quặng từ Overworld, hãy cân nhắc đặt Quarry ở Deep Dark!
		Dù có thể tạo Aether portal ngay sau khi đến Nether, bạn vẫn cần Crown of Skies để mở khóa dimension này!
		Trong 1/4 đầu của modpack, bạn sẽ khám phá Twilight Forest (không bắt buộc), Atum, Erebus (không bắt buộc), Aether và Iceika!
		Flint & Steel cần Flint và STEEL! Đúng như tên gọi...
		Diesel Generator CỰC KỲ ỒN. Bạn đã được cảnh báo.
		Mọi AE2 press chỉ có thể được tìm thấy trong Meteors dưới lòng đất ở Atum!
		Mod Mob Grinding Utils CỰC KỲ OP! Hãy tận dụng thật tốt!
		Bạn không thể mở khóa bay trước Twilight Forest, nhưng có thể dùng phép Roots Sky Soarer, Tinkers' Slime Boots và Slimesling.
		Dark Steel Armor có thể nâng cấp rất mạnh! Dùng Dark Steel Anvil để gắn nâng cấp.
		Một số phép Roots bị xem là quá OP nên chỉ mở khóa sau một số mod công nghệ nhất định.
		Clay rất cân bằng.
		AbyssalCraft, Blood Magic, EvilCraft và Botania liên kết rất chặt chẽ.
