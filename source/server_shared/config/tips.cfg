        Hầu hết vật phẩm có màu đều có thể đục thành màu khác.
        Bạn có thể triệu hồi một số mob bằng Roots Summon Creatures ritual!
        Có thể áp dụng enchantment Holding lên nhiều vật phẩm chứa RF hoặc chất lỏng, giúp chúng tăng đáng kể sức chứa!
        Hầu hết dimension đều có các mạch Excavator tùy chỉnh — hãy xem JEI để tìm chúng!
