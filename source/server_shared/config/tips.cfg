		Phát hiện lỗi? Hãy báo tại https://github.com/Divine-Journey-2/Divine-Journey-2/issues
		Botania Runes được dùng rất nhiều ngay khi mở khóa. Hãy tự động hóa chúng!
		Blood Magic Cores được dùng rất nhiều ngay khi mở khóa. Hãy tự động hóa chúng!
