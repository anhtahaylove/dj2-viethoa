		Tự động hóa Will không hề dễ! Hãy kiên nhẫn và thường xuyên tham khảo Quest Book.
		Bạn có thể phá và thu thập Ethaxium bằng Bound Pickaxe.
		Đây không phải modpack dễ! Nếu thấy nản, hãy bình tĩnh tiến từng bước, xây dựng hệ thống tự động hóa và tham khảo cách người khác vượt qua khó khăn.
		Bạn không cần hạ hầu hết boss quá 2 lần! Nhưng vẫn có thể nếu muốn...
		Nhấp vào End Crystal ở bất kỳ chiều không gian nào để nhận Activated Ender Cores.
		Nửa đầu mục Magic kết hợp Blood Magic, EvilCraft và Botania.
		Nửa sau mục Magic kết hợp Thaumcraft, Bewitchment và DivineRPG, tất cả đều dẫn đến Astral Sorcery.
		Không thể trang bị riêng nhiều Heart Canister. Bạn cần dùng Heart Amulet trong một khe Bauble.
		Không mở khóa được nghiên cứu Thaumcraft? Hãy kiểm tra mọi tab trong Thaumonomicon hoặc làm hành động cụ thể được mô tả trong Quest Book! Nếu thật sự không thích nghiên cứu Thaumcraft, hãy chế tạo Cheater's Thaumonomicon để bỏ qua toàn bộ!
		Hãy tắm Purifying Bath trước khi đóng Thaumcraft Rift! Nếu không, chúng sẽ gây rất nhiều Warp khó chịu.
		Hầu hết công thức chuyển đổi Salis Mundus đã thay đổi. Hãy đọc tooltip của vật phẩm bạn muốn nhận!
		Các loại Botania Quartz được phân cấp, trong đó Lavender Quartz là cấp cao nhất.
		Crafting Table 5x5, 7x7 và 9x9 sẽ dần được mở khóa qua Magic và các mod cuối game.
		Không phải mọi Solar Panel đều được mở khóa ngay, vì vậy hãy thường xuyên kiểm tra lại Chapter 11 xem đã mở khóa thêm chưa.
		Mystical Agriculture được mở khóa qua 6 giai đoạn. Hãy theo dõi Chapter 16 để biết bạn đã mở khóa thêm Seed nào chưa.
		Một số thử thách khá khó. Bạn có thể nhờ trợ giúp trên Discord của chúng tôi: [https://discord.gg/rH9pyS7]!
		Các công trình Astral Sorcery đã bị tắt. Thay vào đó, giờ bạn có thể chế tạo Constellation Papers và Collector Crystals.
		Trong Astral Sorcery, bạn tự hỏi liệu mình có thể vươn tới các vì sao. Rồi bạn mở khóa Galacticraft và mọi ước mơ thành hiện thực.
		Bạn không cần chơi Divine Journey 1 để hiểu modpack này. Tiến trình của nó hoàn toàn độc lập.
        Có thể tạo AE2 Singularities bằng vật phẩm hoặc chất lỏng!
