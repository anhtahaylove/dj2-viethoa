# The tests that need nothing but this repository, on every push.
#
# Not the whole suite, because most of it cannot run here. It is integration
# work bound to a machine with the game installed: it reads the ZIP under
# build/, the server pack extracted into %TEMP%, and the mod JARs in the
# launcher instance. Rebuilding any of that needs the vanilla client jar for
# font metrics, which no runner has. tools/conftest.py skips those tests when
# build/ holds no pack, so a clean checkout reports skips instead of 40
# failures and 14 collection errors that are all missing inputs.
#
# What still runs is everything that reads files tracked in git: format tokens
# and colour codes, line endings, tier reports, cross-store conflicts, runtime
# source extraction, and the pipeline invariants -- including the test pinning
# measure_coverage.py after the builder whose ZIP it opens.
#
# Before a release, run the suite locally with the pack built; the skips turn
# back into real assertions there.
name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Everything else is standard library.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest Pillow

      - name: Line endings
        run: python tools/check_line_endings.py

      - name: Tests that read only tracked sources
        run: python -m pytest -q --no-header

      # A build that failed on a locked ZIP used to skip its own cleanup and
      # seed a .partial beside the release artifact on every run.
      - name: No scratch left behind
        shell: bash
        run: |
          found=$(ls -a build/ 2>/dev/null | grep -i partial || true)
          if [ -n "$found" ]; then
            echo "the suite left scratch in build/:" >&2
            echo "$found" >&2
            exit 1
          fi
